<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Login | Akshaya Deluxe Boys Hostel</title>
  <meta name="description" content="Access the Akshaya Deluxe Boys Hostel student portal. Manage your stay, check weekly food menus, make payments, and raise maintenance tickets.">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 24px 60px 24px;
      background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 50%, var(--primary-ultra-light) 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 2;
    }
    .auth-card {
      padding: 40px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--glass-border);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header h2 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-deep);
      margin-bottom: 8px;
    }
    .auth-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    .auth-actions-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-actions-footer a {
      color: var(--primary-brand);
      font-weight: 600;
      transition: var(--transition-fast);
    }
    .auth-actions-footer a:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    .forgot-link {
      display: block;
      text-align: right;
      font-size: 0.85rem;
      color: var(--primary-brand);
      margin-top: -12px;
      margin-bottom: 24px;
      font-weight: 500;
    }
    .forgot-link:hover {
      color: var(--primary-deep);
      text-decoration: underline;
    }
    .alert-banner {
      display: none;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: var(--radius-md);
      background: #fee2e2;
      border: 1px solid #fca5a5;
      color: #991b1b;
      font-size: 0.9rem;
      font-weight: 500;
      align-items: center;
      gap: 10px;
    }
    @media (max-width: 767px) {
      .auth-section {
        padding-top: 80px;
      }
      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header scrolled" style="position: fixed; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); box-shadow: var(--shadow-sm);">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><i data-lucide="home"></i></div>
        Akshaya<span>Deluxe</span>
      </a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html#home" class="nav-link">Home</a>
        <a href="index.html#about" class="nav-link">About</a>
        <a href="index.html#rooms" class="nav-link">Rooms</a>
        <a href="index.html#facilities" class="nav-link">Facilities</a>
        <a href="index.html#food" class="nav-link">Food Menu</a>
        <a href="index.html#gallery" class="nav-link">Gallery</a>
        <a href="index.html#contact" class="nav-link">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding: 10px 20px; font-size: 0.85rem;">Back to Home</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Login Area -->
  <section class="auth-section">
    <div class="hero-blob hero-blob-1"></div>
    <div class="hero-blob hero-blob-2"></div>
    
    <div class="container auth-container">
      <div class="auth-card glass-card">
        <div class="auth-header">
          <h2>Student Portal</h2>
          <p>Sign in to manage your hostel room & stay</p>
        </div>

        <!-- Inline Error Banner -->
        <div id="authAlert" class="alert-banner">
          <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
          <span id="authAlertMsg"></span>
        </div>
        
        <form id="studentLoginForm">
          <div class="form-group">
            <label class="form-label" for="studPhone">Mobile Number</label>
            <input type="tel" id="studPhone" class="form-input" placeholder="e.g. 9848022338" required pattern="[0-9]{10,15}">
          </div>
          
          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="studPass">Password</label>
            <input type="password" id="studPass" class="form-input" placeholder="••••••••" required>
          </div>
          
          <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>
          
          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">Sign In to Portal</button>
        </form>
        
        <div class="auth-actions-footer">
          <p>New to Akshaya Deluxe? <a href="student-register.html">Register Here</a></p>
          <p style="margin-top: 10px; font-size: 0.8rem;"><a href="admin-login.html" style="color: var(--text-muted);">Admin Dashboard Login</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding: 40px 0 20px 0;">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0; flex-direction: column; text-align: center; gap: 12px;">
      <p>Copyright &copy; 2026 Akshaya Deluxe Boys Hostel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script>
    async function safeFetch(url, options = {}) {
      const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:8080' : '';
      let targetUrl = url;
      if (typeof url === 'string' && url.startsWith('/api/')) {
        targetUrl = API_BASE + url;
      }

      try {
        const response = await fetch(targetUrl, options);
        const text = await response.text();

        if (!text || !text.trim()) {
          return {
            ok: response.ok,
            status: response.status,
            data: {
              success: false,
              message: response.ok ? 'Server returned an empty response.' : `Server error (${response.status})`
            }
          };
        }

        try {
          const data = JSON.parse(text);
          return {
            ok: response.ok,
            status: response.status,
            data: (typeof data === 'object' && data !== null)
              ? data
              : { success: false, message: 'Invalid JSON payload received from server.' }
          };
        } catch (parseErr) {
          console.error('Non-JSON response received:', text);
          const cleanText = text.replace(/<[^>]*>?/gm, '').substring(0, 80).trim();
          return {
            ok: false,
            status: response.status,
            data: {
              success: false,
              message: response.ok
                ? 'Unexpected response format from server.'
                : `Server error (${response.status}): ${cleanText || 'Internal error'}`
            }
          };
        }
      } catch (networkErr) {
        console.error('Network/Connection error:', networkErr);
        return {
          ok: false,
          status: 0,
          data: {
            success: false,
            message: 'Unable to connect to server. Please check your network connection or server status.'
          }
        };
      }
    }

    const form = document.getElementById('studentLoginForm');
    const alertBox = document.getElementById('authAlert');
    const alertMsg = document.getElementById('authAlertMsg');

    function showError(msg) {
      if (alertBox && alertMsg) {
        alertMsg.textContent = msg;
        alertBox.style.display = 'flex';
        if (typeof lucide !== 'undefined') lucide.createIcons();
      }
    }

    function hideError() {
      if (alertBox) alertBox.style.display = 'none';
    }

    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const phoneInput = document.getElementById('studPhone');
        const passInput = document.getElementById('studPass');
        const phone = phoneInput ? phoneInput.value.trim() : '';
        const password = passInput ? passInput.value : '';
        const submitBtn = document.getElementById('submitBtn') || form.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerHTML;

        if (!phone || !password) {
          showError('Please enter both Mobile Number and Password.');
          return;
        }

        try {
          submitBtn.disabled = true;
          if (phoneInput) phoneInput.disabled = true;
          if (passInput) passInput.disabled = true;
          submitBtn.innerHTML = '<span class="loader-spinner" style="width:16px; height:16px; border-width:2px; display:inline-block; margin-right:8px; vertical-align:middle;"></span> Signing In...';

          const res = await safeFetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
          });

          if (res.data && res.data.success) {
            localStorage.setItem('token', res.data.token);
            localStorage.setItem('user', JSON.stringify(res.data.user));
            
            if (res.data.user && (res.data.user.role === 'admin' || res.data.user.role === 'manager')) {
              window.location.href = 'admin/dashboard.html';
            } else {
              window.location.href = 'student/dashboard.html';
            }
          } else {
            const errorMsg = (res.data && res.data.message) ? res.data.message : 'Invalid credentials';
            showError(errorMsg);
          }
        } catch (err) {
          console.error('Student login submit error:', err);
          showError('An unexpected error occurred. Please try again.');
        } finally {
          submitBtn.disabled = false;
          if (phoneInput) phoneInput.disabled = false;
          if (passInput) passInput.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      });
    }
  </script>
</body>
</html>
